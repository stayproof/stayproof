<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StayProof (mock)</title>
  <link rel="icon" href="../src/icons/icon48.png">
  <link rel="stylesheet" href="../src/vendor/leaflet/leaflet.min.css">
  <!-- Cache-bust the real search.css so style edits land on reload without
       a manual browser cache flush. Python's static server uses heuristic
       caching when no Cache-Control header is set, which can return stale
       CSS for many minutes. The query string forces a fresh GET each load. -->
  <script>document.write('<link rel="stylesheet" href="../src/search/search.css?dev=' + Date.now() + '">');</script>
  <!-- CWS-capture mode: ?cws=1 in the URL hides dev-only chrome (version
       badge) so marketing screenshots match the real extension popup.
       Run Playwright at 1280×800 to match the Chrome Web Store spec. -->
  <style>
    .cws-mode #version-badge { display: none; }
  </style>
  <script>
    if (new URLSearchParams(location.search).get('cws') === '1') {
      document.documentElement.classList.add('cws-mode');
    }
  </script>
</head>
<body>
  <header>
    <div class="header-brand">
      <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
        <path d="M64 12 L108 34 L108 72 C108 98 86 116 64 122 C42 116 20 98 20 72 L20 34 Z"
              fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="5"/>
        <path d="M46 66 L58 80 L82 48"
              fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>StayProof</h1>
      <span id="version-badge" class="version-badge"></span>
    </div>
    <p class="subtitle">One search. Three platforms. Real ratings.</p>
  </header>

  <form id="search-form">
    <div class="search-row">
      <input type="text" id="destination" placeholder="Where are you going?" required>
      <input type="date" id="checkin" required>
      <input type="date" id="checkout" required>
      <div class="price-field">
        <span class="price-prefix">$</span>
        <input type="number" id="max-price" placeholder="per night" min="1">
      </div>
      <label for="currency-input" class="visually-hidden">Currency</label>
      <div class="combobox search-currency" id="currency-combobox">
        <div class="combobox-input-wrap">
          <input type="text" id="currency-input" class="combobox-input"
                 placeholder="Currency"
                 role="combobox" aria-controls="currency-listbox"
                 aria-expanded="false" aria-autocomplete="list"
                 aria-haspopup="listbox" autocomplete="off"
                 data-tooltip="Currency">
          <button type="button" class="combobox-caret" aria-label="Toggle currency list" tabindex="-1">▾</button>
        </div>
        <ul id="currency-listbox" class="combobox-listbox" role="listbox" aria-label="Currencies"></ul>
      </div>
      <button type="submit" id="search-btn">Search</button>
    </div>
    <div class="filter-row">
      <label class="filter-label">
        <input type="checkbox" id="entire-homes-only" checked>
        Entire Homes
      </label>
      <label class="filter-label">
        <input type="checkbox" id="guest-favourite-only" checked>
        Guest Favourite
      </label>
      <label class="filter-label">
        <input type="checkbox" id="top-rated-only" checked>
        Top Rated
      </label>
      <input type="checkbox" id="dev-mode" hidden>
    </div>
  </form>

  <div id="status" class="search-status"></div>

  <div id="map-toolbar" style="display: none;">
    <button id="map-toggle-btn" type="button">Show Map</button>
    <span id="map-status"></span>
  </div>
  <div id="map-container" style="display: none;"></div>

  <div id="results" class="results-table"></div>

  <!-- LOCAL MOCK ONLY — NOT shipped to production. The chrome-stub must be
       loaded BEFORE any of the real shared scripts because they reference
       chrome.* at module scope. mock-data.js exposes window.MOCK_*; the
       stub reads from those when the page asks for search results.

       Each tag is emitted via document.write with a ?dev=<timestamp>
       query so edits to ../src/* land on every reload — Python's static
       server uses heuristic caching, which otherwise returns stale JS for
       many minutes. document.write preserves execution order because
       these are synchronous scripts in the parser. -->
  <script>
    (function () {
      var v = '?dev=' + Date.now();
      var scripts = [
        './chrome-stub.js',
        './mock-data.js',
        '../src/vendor/leaflet/leaflet.min.js',
        '../src/shared/scoring-config.js',
        '../src/shared/name-matching.js',
        '../src/shared/scoring.js',
        '../src/shared/currency.js',
        '../src/shared/xref-candidates.js',
        '../src/search/search.js'
      ];
      for (var i = 0; i < scripts.length; i++) {
        document.write('<script src="' + scripts[i] + v + '"><' + '/script>');
      }
    })();
  </script>

  <!-- Auto-trigger search after the page wires up so the mock renders results
       without needing a manual click. Useful for screenshot runs. -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Pre-fill the form so submit() validates without user input.
      document.getElementById('destination').value = 'ubud, bali';
      // Wait one tick for setupCurrencyCombobox to seed input value from storage.
      setTimeout(function () {
        var btn = document.getElementById('search-btn');
        if (btn) btn.click();
      }, 60);
    });
  </script>
</body>
</html>
